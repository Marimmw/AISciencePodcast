# CQL-Suchen für Patente (Datum wird automatisch ergänzt). ta = Titel/Abstract, cpc = Patentklasse.
# Bei "HTTP 400" im Log ist eine Suche fehlerhaft: einfach vereinfachen oder löschen.
patent_queries:
  SoftRobotik_Aktuatoren: 'ta="soft robot" or ta="artificial muscle" or ta="shape memory alloy" or ta="soft actuator" or ta="electroactive polymer"'
  Robotik_Hardware: 'cpc=B25J and (ta=gripper or ta=exoskeleton or ta="robot hand" or ta="continuum robot" or ta=microrobot)'
  Luftfahrt: '(cpc=B64C or cpc=B64D or cpc=B64U) and (ta=morphing or ta=hydrogen or ta="electric propulsion" or ta=eVTOL or ta="vertical take-off")'
  Raumfahrt_Raketen: 'cpc=B64G or cpc=F03H or (cpc=F02K and ta=rocket)'
  Medizinrobotik: 'cpc=A61B and (ta="surgical robot" or ta="continuum robot" or ta=microrobot or ta="robotic catheter" or ta="magnetic actuation")'
  Energie: '(cpc=H01M or cpc=C25B or cpc=G21B or cpc=H10K) and (ta="solid-state" or ta="sodium-ion" or ta=electrolyzer or ta=perovskite or ta=fusion or ta="energy storage")'
  AutonomeFahrzeuge: '(cpc=B60W or cpc=G05D or cpc=G01S) and (ta=lidar or ta="autonomous vehicle" or ta="self-driving")'
  Maritim: '(cpc=B63G or cpc=B63H or cpc=B63C) and (ta=underwater or ta=submersible or ta="unmanned underwater vehicle")'
  DeepTech: 'ta=neuromorphic or ta="photonic chip" or ta=metamaterial or ta="quantum sensor" or ta="quantum computing"'