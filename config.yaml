  Nature Machine Intelligence: "https://www.nature.com/natmachintell.rss"
  Nature Biomedical Engineering: "https://www.nature.com/natbiomedeng.rss"
  TechXplore Robotik: "https://techxplore.com/rss-feed/robotics-news/"
  TechXplore Engineering: "https://techxplore.com/rss-feed/engineering-news/"
  Phys.org Raumfahrt: "https://phys.org/rss-feed/space-news/"
