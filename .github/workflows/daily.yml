name: daily-podcast
on:
  schedule:
    - cron: "30 3 * * *"   # 03:30 UTC = 04:30/05:30 Uhr deutscher Zeit; Laufzeit ca. 10-30 min
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Vorherigen Stand holen
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site \
            || mkdir -p site
      - name: Folge erzeugen
        run: python podcast.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          EPO_OPS_KEY: ${{ secrets.EPO_OPS_KEY }}        # nur für die optionale Patent-Ecke
          EPO_OPS_SECRET: ${{ secrets.EPO_OPS_SECRET }}
      - name: Veröffentlichen (Historie wird klein gehalten)
        run: |
          cd site
          rm -rf .git
          git init -b gh-pages
          git config user.name "podcast-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Folge $(date -u +%F)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages